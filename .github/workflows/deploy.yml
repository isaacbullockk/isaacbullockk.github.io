name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm 10 (bundled with node 20) hits "Exit handler never called" and leaves a
      # partial node_modules while exiting 0 — upgrade npm first.
      - run: npm install -g npm@11
      - name: Install dependencies (retry once on npm crash)
        run: |
          npm ci --no-audit || { echo "::warning::npm ci failed, wiping node_modules and retrying"; rm -rf node_modules; npm ci --no-audit; }
      - name: Verify install
        run: |
          test -d node_modules/vite-plugin-pwa
          node_modules/.bin/tsc --version
      - run: npm run build
      # SPA fallback: serve index.html for any unknown path (client-side routing)
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
